name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install proto
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://moonrepo.dev/install/proto.sh) --yes
          echo "$HOME/.proto/bin" >> "$GITHUB_PATH"
          echo "$HOME/.proto/shims" >> "$GITHUB_PATH"

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          proto install
          node --version
          yarn --version

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          yarn install --immutable

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          yarn build

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          yarn lint

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          yarn format:check

      - name: Install Xvfb + Chrome runtime deps (for extension E2E)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libxkbcommon0 \
            libasound2

      - name: E2E (load MV3 unpacked extension)
        shell: bash
        run: |
          set -euo pipefail
          yarn test:e2e:ci
